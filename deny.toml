[graph]
all-features = true

[advisories]
ignore = []

[licenses]
confidence-threshold = 0.8
unused-allowed-license = "allow"

allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"

allow-registry = [
    "https://github.com/rust-lang/crates.io-index",
]

allow-git = []